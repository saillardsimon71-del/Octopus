# Inventaire des ressources reelles mises a disposition d'OCTOPUS.
#
# Ce fichier decrit CE QUI EXISTE, pas ce qu'il faut en faire. Aucune ligne ici n'est une consigne
# commerciale : les decisions d'usage, de combinaison ou d'abandon appartiennent a OCTOPUS et
# passent par la boucle strategique et economique.
#
# - `capabilities` : ce que la ressource permet techniquement, pas ce qu'on veut en tirer.
# - `needs`        : les frontieres qui exigent reellement un humain (login, oauth, 2fa, kyc,
#                    signature, bank_validation, legal, payment_method, captcha).
# - `probe`        : sonde automatique quand un constat objectif est possible (http, dns, env,
#                    command, host). Sans sonde, la ressource reste `declared` jusqu'a constat.
#
# `python -m octopus resources sync` puis `check` mettent la base a jour.

# --- identite legale et obligations ---
[[resource]]
key = "micro_entreprise"
kind = "legal"
label = "Micro-entreprise francaise active (SIRET)"
capabilities = ["facturer", "encaisser", "contracter"]
needs = ["legal"]
notes = "Statut et SIRET existants. Etat a constater par l'humain (aucune sonde automatique ici)."

[[resource]]
key = "impots"
kind = "administration"
label = "Espace impots"
locator = "https://www.impots.gouv.fr"
capabilities = ["declarer", "consulter_obligations"]
needs = ["login", "2fa"]

[[resource]]
key = "urssaf"
kind = "administration"
label = "Espace URSSAF"
locator = "https://www.autoentrepreneur.urssaf.fr"
capabilities = ["declarer_chiffre_affaires", "consulter_cotisations"]
needs = ["login", "2fa"]

[[resource]]
key = "france_travail"
kind = "administration"
label = "Espace France Travail"
locator = "https://www.francetravail.fr"
capabilities = ["consulter_droits", "declarer_situation"]
needs = ["login", "2fa"]

# --- argent ---
[[resource]]
key = "compte_bancaire"
kind = "finance"
label = "Compte bancaire personnel utilise pour l'activite"
capabilities = ["recevoir_virement", "payer"]
needs = ["login", "2fa", "bank_validation"]
notes = "Separation d'un compte dedie : decision a prendre si un besoin observe l'exige, pas avant."

[[resource]]
key = "stripe"
kind = "paiement"
label = "Stripe (liens de paiement et produits deja commences)"
locator = "https://dashboard.stripe.com"
capabilities = ["encaisser", "lien_paiement", "catalogue_produits", "api"]
needs = ["login", "oauth"]
probe = "env"
probe_args = { vars = ["STRIPE_API_KEY"] }

[[resource]]
key = "revolut"
kind = "finance"
label = "Revolut"
capabilities = ["recevoir_virement", "payer", "multi_devises"]
needs = ["login", "2fa"]

