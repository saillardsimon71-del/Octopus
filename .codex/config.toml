# OCTOPUS project-local Codex policy.
# Loaded by Codex only when this repository is trusted.
# Keep model intelligence at the root; implementation delegation is handled by
# OCTOPUS development.task/Kilo, not Codex native subagents.

model = "gpt-6-astra"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"

# Human remains the approval authority. Never use the automatic approval-review
# subagent, which would add another model loop.
approval_policy = "on-request"
approvals_reviewer = "user"

# Astra works from a pre-fetched local workspace. Networked dependency/source
# retrieval and long workers are human-run out-of-band operations.
sandbox_mode = "workspace-write"
web_search = "disabled"

[sandbox_workspace_write]
network_access = false

[agents]
# Critical quota rule: native Codex multi-agent tools are disabled.
# Cheap implementation workers are spawned by OCTOPUS/Kilo instead.
enabled = false

[features]
# Keep this session single-root and explicitly turn off every Codex-native
# continuation/delegation mechanism that could consume allowance behind the
# OCTOPUS worker boundary.
multi_agent = false
goals = false
memories = false
fast_mode = false
apps = false
plugins = false
remote_plugin = false
hooks = false
skill_search = false

# Do not let a skill silently install missing MCP dependencies.
skill_mcp_dependency_install = false
shell_tool = true

[skills]
# Do not inject global/bundled/plugin skill catalogs into Astra's context.
# This project's workflow is carried by AGENTS.md + the phase router.
include_instructions = false

[memories]
# Defense in depth: do not inject prior memories and do not turn this temporary
# constructor session into input for future memory generation.
use_memories = false
generate_memories = false
