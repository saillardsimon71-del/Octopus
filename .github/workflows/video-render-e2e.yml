name: video-render-e2e

# Test de bout en bout de la chaîne vidéo (voix cloud Hugging Face -> Remotion -> FFmpeg -> QC).
# Déclenchement manuel uniquement : ce workflow vérifie le logiciel, il n'est pas un service de production.
on:
  push:
    branches:
      - "render/**"
  workflow_dispatch:
    inputs:
      offer_id:
        description: "offre à rendre (jobs/<offer_id>.json)"
        required: true
        default: "cash_devis_cgv01"

concurrency:
  group: video-render-e2e
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Voix : azure/cloudflare si les secrets existent, sinon piper (local au runner, sans compte).
      # Le Space Hugging Face n'est plus dans la chaine par defaut : son quota anonyme ne tient pas un short.
      TTS_CHAIN: "azure,cloudflare,piper"
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_TTS_VOICE: ${{ vars.AZURE_TTS_VOICE }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CHATTERBOX_LANG: "fr"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "piper-tts>=1.3,<2" "faster-whisper>=1.2,<2"
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci
      - name: Render short
        run: python tools/render_short.py "${{ inputs.offer_id || 'cash_devis_cgv01' }}"
      - name: Upload video and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.offer_id || 'cash_devis_cgv01' }}-${{ github.run_id }}
          path: |
            out/${{ inputs.offer_id || 'cash_devis_cgv01' }}/final.mp4
            out/${{ inputs.offer_id || 'cash_devis_cgv01' }}/render_report.json
            out/${{ inputs.offer_id || 'cash_devis_cgv01' }}/qc_metrics.json
            out/${{ inputs.offer_id || 'cash_devis_cgv01' }}/credits.txt
            out/${{ inputs.offer_id || 'cash_devis_cgv01' }}/frames/
            out/${{ inputs.offer_id || 'cash_devis_cgv01' }}/logs/
          if-no-files-found: warn
          retention-days: 14
