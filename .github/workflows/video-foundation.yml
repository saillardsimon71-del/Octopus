name: video-foundation

on:
  push:
    branches:
      - feat/cloud-video-foundation
  pull_request:
    paths:
      - "octopus/video/**"
      - "video_worker/**"
      - "tests/test_video_*.py"
      - "tools/make_audio_chatterbox_full.py"
      - ".github/workflows/video-foundation.yml"

jobs:
  contract-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest "runpod>=1.7,<2" "boto3>=1.35,<2" "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Compile cloud video modules
        run: python -m compileall -q octopus/video video_worker tools/make_audio_chatterbox_full.py
      - name: Run cloud video tests
        run: python -m pytest -q tests/test_video_contract.py tests/test_video_service.py tests/test_video_cloud_client.py tests/test_video_executor.py
