name: video-foundation

on:
  push:
    branches:
      - feat/cloud-video-foundation
  pull_request:
    paths:
      - "octopus/video/**"
      - "octopus/media/**"
      - "octopus/catalog.py"
      - "octopus/llm.py"
      - "agents/deepseek.py"
      - "agents/browser.py"
      - "agents/web_guard.py"
      - "agents/doctor.py"
      - "video_worker/**"
      - "tools/make_audio_chatterbox_full.py"
      - "agents/tools.py"
      - "agents/gui/**"
      - "tests/test_video_*.py"
      - "tests/test_omniroute.py"
      - "tests/test_minimax_h3_cloud.py"
      - "tests/test_browser_integration.py"
      - "tests/test_doctor.py"
      - "requirements-local.txt"
      - "setup-local.ps1"
      - ".github/workflows/video-foundation.yml"

concurrency:
  group: video-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cloud worker dependencies
        run: python -m pip install --upgrade pip && python -m pip install "runpod>=1.7,<2" "boto3>=1.35,<2" "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Compile cloud video modules
        run: python -m compileall -q octopus/video octopus/media video_worker octopus/catalog.py octopus/llm.py agents/deepseek.py agents/browser.py agents/doctor.py tools/make_audio_chatterbox_full.py agents/tools.py
      - name: Run cloud, H3 and OmniRoute tests
        run: python -m pip install pytest && python -m pytest -q tests/test_video_*.py tests/test_omniroute.py tests/test_minimax_h3_cloud.py

  local-browser-and-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages for GUI/runtime compatibility
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight local requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-local.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile local control plane
        run: python -m compileall -q agents octopus
      - name: Run browser, doctor and coordination tests
        run: python -m pytest -q tests/test_browser_integration.py tests/test_doctor.py tests/test_gateway.py tests/test_cycle_logic.py
