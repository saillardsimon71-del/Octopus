name: video-foundation

on:
  push:
    branches:
      - feat/cloud-video-foundation
      - feat/autonomous-business-foundation
  pull_request:

permissions:
  contents: read

concurrency:
  group: video-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install cloud worker dependencies
        run: python -m pip install --upgrade pip && python -m pip install "runpod>=1.7,<2" "boto3>=1.35,<2" "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Compile cloud video modules
        run: python -m compileall -q octopus/video octopus/media video_worker octopus/catalog.py octopus/llm.py agents/deepseek.py agents/browser.py agents/doctor.py tools/make_audio_chatterbox_full.py agents/tools.py
      - name: Build hardened Python canary sandbox
        run: docker build -f docker/dev-sandbox.Dockerfile -t octopus-test-sandbox:py311 .
      - name: Verify sandbox pytest version
        run: docker run --rm octopus-test-sandbox:py311 python -m pytest --version
      - name: Verify sandbox Tk imports
        run: docker run --rm octopus-test-sandbox:py311 python -c "import tkinter, customtkinter; print('tk-sandbox-ok')"
      - name: Run cloud, H3 and OmniRoute tests
        run: python -m pip install pytest && python -m pytest -q tests/test_video_*.py tests/test_omniroute.py tests/test_dev_worker.py tests/test_night_shift.py tests/test_promotion.py tests/test_minimax_h3_cloud.py

  local-browser-and-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system packages for GUI/runtime compatibility
        run: sudo apt-get update && sudo apt-get install -y python3-tk ffmpeg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install lightweight local requirements
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements-local.txt "runpod>=1.7,<2" "boto3>=1.35,<2"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile local control plane
        run: python -m compileall -q agents octopus
      - name: Run browser, doctor, GUI, coordination and Orca tests
        run: python -m pytest -q tests/test_browser_integration.py tests/test_web_guard.py tests/test_doctor.py tests/test_gateway.py tests/test_cycle_logic.py tests/test_orca.py tests/test_gui.py tests/test_gui_intelligence.py tests/test_capabilities.py
      - name: Run strategic loop and multi-business tests
        run: python -m pytest -q tests/test_strategy.py tests/test_second_business_loop.py tests/test_business_propagation.py tests/test_connectors.py tests/test_economy.py tests/test_actions.py tests/test_agent_economy_tools.py tests/test_tasks_worker.py tests/test_journal.py
      - name: Run complete Python test suite
        run: python -m pytest -q
