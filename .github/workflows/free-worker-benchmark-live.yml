name: zero-cost-free-worker-benchmark-live-replacements

on:
  push:
    branches:
      - bench/free-workers-20260925
    paths:
      - ".github/workflows/free-worker-benchmark-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-cost-free-worker-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: "${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: Laguna S 2.1 Free
            slug: laguna-s-2.1
            model: "kilo/poolside/laguna-s-2.1:free"
          - label: Nemotron 3 Ultra Free
            slug: nemotron-3-ultra
            model: "kilo/nvidia/nemotron-3-ultra-550b-a55b:free"
          - label: North Mini Code Free
            slug: north-mini-code
            model: "kilo/cohere/north-mini-code:free"

    steps:
      - name: Checkout benchmark branch without push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-local.txt

      - name: Install OCTOPUS test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt
          python -m pip install pytest

      - name: Install Kilo CLI
        run: |
          curl -fsSL https://kilo.ai/cli/install | bash
          echo "$HOME/.kilo/bin" >> "$GITHUB_PATH"

      - name: Verify exact free route is in live Kilo catalog
        env:
          BENCHMARK_MODEL: "${{ matrix.model }}"
        run: |
          kilo --version
          echo "Worker: $BENCHMARK_MODEL"
          kilo models kilo | grep -F -x "$BENCHMARK_MODEL"

      - name: Run two historical OCTOPUS repair cases
        env:
          BENCHMARK_MODEL: "${{ matrix.model }}"
        run: |
          python benchmarks/free_worker/run_benchmark.py --model "$BENCHMARK_MODEL"

      - name: Publish benchmark summary
        if: always()
        run: |
          find benchmark-results -name summary.json -print -exec cat {} \; || true

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "free-worker-live-${{ matrix.slug }}"
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 7
