name: free-worker-benchmark-v2

on:
  push:
    branches:
      - bench/free-workers-20260925
    paths:
      - ".github/workflows/free-worker-benchmark-v2.yml"
      - "benchmarks/free_worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-worker-benchmark-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: "benchmark-v2-${{ matrix.id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: step-3-7-flash
            model: "kilo/stepfun/step-3.7-flash:free"
          - id: nemotron-3-ultra
            model: "kilo/nvidia/nemotron-3-ultra-550b-a55b:free"
          - id: north-mini-code
            model: "kilo/cohere/north-mini-code:free"
          - id: laguna-s-2-1
            model: "kilo/poolside/laguna-s-2.1:free"

    steps:
      - name: Checkout without push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install OCTOPUS test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt

      - name: Install proven Kilo CLI
        run: |
          curl -fsSL https://kilo.ai/cli/install | bash
          echo "$HOME/.kilo/bin" >> "$GITHUB_PATH"

      - name: Verify exact free route
        env:
          BENCHMARK_MODEL: "${{ matrix.model }}"
        run: |
          test "$(kilo --version)" = "7.7.9"
          kilo models kilo | grep -F -x "$BENCHMARK_MODEL"

      - name: Run benchmark
        env:
          BENCHMARK_MODEL: "${{ matrix.model }}"
        run: |
          python benchmarks/free_worker/run_benchmark.py --model "$BENCHMARK_MODEL"

      - name: Print summary
        if: always()
        run: |
          find benchmark-results -name summary.json -print -exec cat {} \; || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "free-worker-v2-${{ matrix.id }}"
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 7
