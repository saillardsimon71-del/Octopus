name: H3 remote canary after #97

on:
  push:
    branches:
      - "canary/h3-after-97-remote"

permissions:
  contents: read

jobs:
  h3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCTOPUS: "on"
      OCTOPUS_HOME: ${{ github.workspace }}
      OCTOPUS_DB: ${{ github.workspace }}/data/h3_remote_after_97.db
      PODALUX_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install minimal H3 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai>=1.99,<2" "requests>=2.32,<3" "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Run H3 canary
        id: h3
        shell: bash
        run: |
          mkdir -p artifacts data
          python - <<'PY' | tee artifacts/h3_console.txt
          import json
          import os
          from pathlib import Path

          from octopus import worker, tasks

          goal = """MISSION DE DÉCOUVERTE ÉCONOMIQUE RÉELLE.

          Cherche sur le web public ACTUEL des signaux commerciaux concrets pouvant mener
          à une offre testable rapidement et légalement par un petit opérateur numérique/IA.

          Ne pars PAS de nos idées business précédentes et ne cherche pas à confirmer une
          activité déjà connue. Explore plusieurs types d'acheteurs et plusieurs problèmes.

          Priorise les preuves où de l'argent, du temps ou une urgence sont réellement visibles :
          - demandes explicites de prestataire ou d'outil ;
          - missions freelance ;
          - appels d'offres accessibles ;
          - offres d'emploi révélant un travail manuel/coûteux ;
          - plaintes concrètes et répétées ;
          - solutions existantes payantes qui résolvent mal un problème ;
          - obligations ou échéances récentes créant un travail à réaliser.

          Les acheteurs doivent être joignables depuis la France, directement ou en ligne.
          Privilégie ce qui pourrait être testé dans les 7 jours sans développement lourd
          et sans dépense initiale importante.

          Cherche plusieurs voies économiques distinctes.
          Ne construis rien.
          Ne contacte personne.
          Ne dépense rien.
          N'invente aucune preuve.

          Objectif : produire au moins 3 signaux réellement qualifiés, idéalement issus
          d'au moins 2 segments différents. Si une preuve est faible, rejette le signal
          plutôt que de remplir artificiellement le quota."""

          payload = {
              "goal": goal,
              "max_steps": 8,
              "allowed_tools": ["search", "browse"],
              "profile": "flash_fallback",
              "search_browse_lockstep": True,
              "search_browse_selector": "evidence_relevance",
              "business_signal_focus": True,
              "business_signal_target": 3,
              "success_criterion": {"metric": "usable_browse_count", "gte": 4},
              "trace_tools": True,
          }

          Path("artifacts/provider_presence.json").write_text(
              json.dumps(
                  {
                      name: bool(os.environ.get(name, "").strip())
                      for name in (
                          "DEEPSEEK_API_KEY",
                          "GROQ_API_KEY",
                          "GEMINI_API_KEY",
                          "KILO_API_KEY",
                          "OPENROUTER_API_KEY",
                          "CEREBRAS_API_KEY",
                          "BRAVE_API_KEY",
                          "TAVILY_API_KEY",
                      )
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )

          worker.load_handlers()
          task_id = worker.enqueue("octopus", "orbit.mission", payload, priority=10)
          print(f"H3 task id: {task_id}")
          result = worker.run_one(kinds=["orbit.mission"])
          Path("artifacts/h3_result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, default=str),
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2, default=str))
          if not result or result.get("status") not in {"done", "done_degraded"}:
              raise SystemExit(2)
          PY

      - name: Upload H3 result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h3-after-97-remote-${{ github.run_id }}
          path: |
            artifacts/h3_result.json
            artifacts/h3_console.txt
            artifacts/provider_presence.json
            data/h3_remote_after_97.db
          if-no-files-found: warn
          retention-days: 7
