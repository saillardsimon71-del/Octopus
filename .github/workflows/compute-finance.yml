name: Compute finance safety

on:
  push:
    branches:
      - "feat/salad-compute-provider"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run compute safety tests
        run: >-
          python -m pytest -q
          tests/test_compute_finance.py
          tests/test_compute_salad.py
          tests/test_compute_broker.py
          tests/test_compute_gpuai.py
          tests/test_compute_no_bypass.py
