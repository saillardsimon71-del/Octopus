name: Compute finance safety

on:
  push:
    branches:
      - "feat/salad-compute-provider"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run compute safety tests
        run: >-
          python -m pytest -q
          tests/test_compute_finance.py
          tests/test_compute_salad.py
          tests/test_compute_broker.py
          tests/test_compute_gpuai.py
