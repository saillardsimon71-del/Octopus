name: zero-cost-free-worker-benchmark

on:
  push:
    branches:
      - bench/free-workers-20260925
    paths:
      - ".github/workflows/free-worker-benchmark.yml"
      - "benchmarks/free_worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-cost-free-worker-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: "${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: Step 3.7 Flash Free
            slug: step-3.7-flash
            model: "kilo/stepfun/step-3.7-flash:free"
          - label: Nex N2.5 Pro Free
            slug: nex-n2.5-pro
            model: "kilo/nex-agi/nex-n2.5-pro:free"
          - label: MiniMax M3 Free
            slug: minimax-m3
            model: "kilo/minimax/minimax-m3:free"
          - label: Hy3 Free
            slug: hy3
            model: "kilo/tencent/hy3:free"

    steps:
      - name: Checkout benchmark branch without push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-local.txt

      - name: Install OCTOPUS test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt
          python -m pip install pytest

      - name: Install Kilo CLI
        run: |
          curl -fsSL https://kilo.ai/cli/install | bash
          echo "$HOME/.kilo/bin" >> "$GITHUB_PATH"

      - name: Verify Kilo CLI
        run: |
          kilo --version
          echo "Worker: ${{ matrix.model }}"
          env | grep -E 'KILO.*(KEY|TOKEN|SECRET)|GITHUB_TOKEN' && {
            echo "Unexpected credential-like environment variable exposed to benchmark shell"
            exit 1
          } || true

      - name: Run two historical OCTOPUS repair cases
        env:
          BENCHMARK_MODEL: "${{ matrix.model }}"
        run: |
          python benchmarks/free_worker/run_benchmark.py --model "$BENCHMARK_MODEL"

      - name: Publish benchmark summary
        if: always()
        run: |
          find benchmark-results -name summary.json -print -exec cat {} \; || true

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "free-worker-${{ matrix.slug }}"
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 7
