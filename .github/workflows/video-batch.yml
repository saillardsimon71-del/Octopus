name: video-batch

# Produit toutes les offres en parallele sur les runners GitHub (20 jobs simultanes sur le plan Free).
# Declenchement manuel : ce workflow produit des artefacts, il ne publie rien.
on:
  workflow_dispatch:
    inputs:
      offers:
        description: "offres separees par des espaces (vide = toutes celles de jobs/)"
        required: false
        default: ""

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          asked = os.environ["OFFERS"].split()
          offers = asked or sorted(p.stem for p in pathlib.Path("jobs").glob("*.json"))
          print("matrix=" + json.dumps({"offer": offers}))
          PY
        env:
          OFFERS: ${{ inputs.offers }}

  render:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    env:
      TTS_CHAIN: "azure,cloudflare,piper"
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_TTS_VOICE: ${{ vars.AZURE_TTS_VOICE }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip && python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "piper-tts>=1.3,<2"
      - working-directory: remotion
        run: npm ci
      - run: python tools/render_short.py "${{ matrix.offer }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-${{ matrix.offer }}-${{ github.run_id }}
          path: |
            out/${{ matrix.offer }}/final.mp4
            out/${{ matrix.offer }}/qc_metrics.json
            out/${{ matrix.offer }}/render_report.json
            out/${{ matrix.offer }}/credits.txt
            out/${{ matrix.offer }}/logs/
          if-no-files-found: warn
          retention-days: 14
